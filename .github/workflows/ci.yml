name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pytest -q
      - run: hindi2pt tests/fixtures/sample.hi.vtt -o /tmp/out -b dummy && cat /tmp/out/sample.pt-BR.srt
