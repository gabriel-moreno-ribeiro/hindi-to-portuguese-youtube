[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hindi2pt"
version = "2.0.0"
description = "Legendas (e dublagem) em portugues do Brasil pra videos do YouTube em hindi"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["yt-dlp>=2024.1.1"]

[project.optional-dependencies]
offline = ["argostranslate>=1.9"]
dub = ["edge-tts>=6.1", "gTTS>=2.0"]
whisper = ["faster-whisper>=1.0"]
legacy = ["youtube-dl", "googletrans==2.4.0"]
dev = ["pytest>=8"]

[project.scripts]
hindi2pt = "hindi2pt.cli:main"

[tool.setuptools.packages.find]
include = ["hindi2pt*"]
